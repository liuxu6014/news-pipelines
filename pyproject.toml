[project]
name = "scrapy-template"
version = "0.1.0"
description = "Scrapy crawler template managed with uv"
requires-python = ">=3.12"
dependencies = [
    "curl-cffi>=0.17.0",
    "kafka-python>=3.0.12",
    "playwright>=1.64.1",
    "psycopg2-binary>=2.9.10",
    "pymysql>=1.2.0",
    "python-dotenv>=1.2.2",
    "scrapy>=2.16.0",
    "spider-monitor[scrapy]==0.2.2",
]

[dependency-groups]
dev = [
    "ipython>=8.0",
    "pytest>=9.1.1",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# 明确钉死规则集，避免 ruff 版本升级导致默认规则集漂移。
# 不启用 preview 规则（FURB 等），保持 CI 稳定。
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF", "SIM"]
ignore = [
    # Scrapy spider 的 start_urls / allowed_domains / custom_settings 是框架约定的类属性，
    # 不适合改成 ClassVar 注解。
    "RUF012",
    # 中文全角标点（，。：（）等）不是"歧义 Unicode 字符"，RUF001/002/003 对中文是误报。
    "RUF001",
    "RUF002",
    "RUF003",
    # tools/tests 通过 sys.path 引导后导入 run_spider / app，属于脚本级合法写法。
    "E402",
]
